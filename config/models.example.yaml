deterministic:
  python: PIN_ENVIRONMENT_VERSION
  statistics: PIN_ENVIRONMENT_VERSION
  optimizer: OPTIONAL_SOLVER_AND_LICENSE
  latex: XeLaTeX_biber_latexmk

human:
  decides_problem_ambiguity: true
  decides_model_tradeoffs: true
  decides_independent_reviewer_suggestions: true
  confirms_official_rules_and_submission: true
