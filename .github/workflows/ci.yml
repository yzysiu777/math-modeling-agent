name: workspace-ci

on:
  push:
    branches: [main, "refactor/**", "luna/**", "model/**", "analysis/**", "paper/**", "review/**"]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-lang-chinese \
            texlive-latex-extra texlive-pictures texlive-fonts-recommended \
            texlive-bibtex-extra poppler-utils

      - name: Validate workspace contracts
        run: python3 scripts/validate_workspace.py

      - name: Run synthetic tests
        run: python3 -m unittest discover -s tests -v

      - name: Run generic modeling demonstrations
        run: make demos

      - name: Compile Python contracts
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Compile LaTeX CI profile
        run: make PAPER_FONTSET=fandol paper-ci

      - name: Compile upstream template example
        run: make PAPER_FONTSET=fandol paper-example

      - name: Run paper QA after build
        run: make PAPER_FONTSET=fandol qa

      - name: Upload preview PDF
        uses: actions/upload-artifact@v4
        with:
          name: latex-preview
          path: paper/build/main.pdf
