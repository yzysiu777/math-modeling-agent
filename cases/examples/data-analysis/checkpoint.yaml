# 案例级轻量控制文件：队员或角色可手工编辑，不是身份认证或审批系统。
case_id: data-analysis
routing:
  suggested: data_analysis
  confirmed: true
  confirmed_route: data_analysis
  confirmed_by: 演示队员
  note: 演示案例，切分规则与指标由简报直接给定，无会改变路线的歧义

# C1 可写 not_needed，但必须在 review_notes.C1 留下简短理由。
reviews:
  C1: not_needed
  C2: pending
  C3: pending
review_notes:
  C1: 演示案例，切分规则与指标由简报直接给定，无会改变路线的歧义

# 进入摘要/结论等强主张阶段时由写作手或队员明确标记。
paper_claims_active: false
performance_concern: false

# 优先由 experiments/outputs/checks/*.json 的复算报告自动点亮；
# 这里的人手填写值作为覆盖手段。
deterministic_risks:
  infeasible: false
  objective_mismatch: false
  leakage: false
  split_overlap: false
